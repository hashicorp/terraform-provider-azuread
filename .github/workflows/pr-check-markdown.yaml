name: Markdown Lint

# markdownlint over the repo's markdown (docs guides and index, README, .github).

permissions:
  contents: read

on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/**/*.md'
      - '.markdownlint.yml'
      - '.github/workflows/pr-check-markdown.yaml'
      - 'GNUmakefile'

concurrency:
  group: 'pr-check-markdown-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # make npm installs the markdownlint-cli2 version pinned in GNUmakefile into .tools
      - run: make markdownlint
