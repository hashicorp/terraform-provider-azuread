---
name: Issue Opened Triage

# Auto-labels newly opened issues using the title/body regexes in
# .github/labeler-issue-triage.yaml.

permissions:
  issues: write

on:
  issues:
    types: [opened]

jobs:
  issue_triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler-issue-triage.yaml
          enable-versioned-regex: 0
