---
name: Main Branch Checks

# Runs the tree-state CI checks on every push to main (and release branches).
# PR checks only run on pull_request events, so without this workflow a merge to
# main is never validated: two PRs that are each green in isolation can still
# break main when combined (semantic merge conflicts, a renamed helper another
# PR started using, etc.).
#
# Every job runs on every push - deliberately no path filtering. A per-push
# paths filter makes the branch tip's green check meaningless: a docs-only or
# workflow-only push would skip the Go checks and show green even when the
# previous (code) push failed or had its run cancelled. Since every run covers
# the complete tree state, cancelling a superseded run loses nothing.
#
# This intentionally duplicates the check jobs in pr-checks-combined.yaml (and
# teamcity-test.yaml) rather than adding a push trigger to them: those workflows
# feed the PR comment/labeling machinery (pr-save-artifacts.yaml -> workflow_run
# watchers matched by display name), which has no PR to act on for a push
# event. Keep the check steps here in sync with their PR counterparts when
# updating either side.
#
# The OIDC provider acceptance tests are excluded — nightly TeamCity runs cover
# main.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**

concurrency:
  # Only the newest push per branch matters - the tip includes earlier merges,
  # and since every run executes all checks the newest run supersedes any it cancels.
  group: 'main-checks-${{ github.ref }}'
  cancel-in-progress: true

jobs:

  # Unlike the PR workflow there is no fail-fast phasing here: on main we want
  # the complete picture of everything broken in one run, not saved runner time.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build Provider
        run: go build -v -o /dev/null main.go

  depscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - run: make depscheck

  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      # make builds the golangci-lint and terrafmt versions pinned in .tools/go.mod on demand
      - run: make quick-checks

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - run: make docs-lint

  golint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      # The tfproviderlint module plugin requires a custom-built golangci-lint binary (see
      # .tools/.custom-gcl.yml); cache .tools/bin so it is only rebuilt when the pins
      # (.tools/go.mod for golangci-lint, .custom-gcl.yml for the plugin) change. make rebuilds
      # the binary when it is missing or older than either file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin
          key: golangci-with-modules-${{ hashFiles('.tools/go.mod', '.tools/go.sum', '.tools/.custom-gcl.yml') }}
          lookup-only: true
      - name: Build golangci-lint with plugins
        run: make golangci-with-modules
      - name: Run golangci-lint
        run: .tools/bin/golangci-with-modules run -v ./...

  gencheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - run: make gencheck

  unit-tests:
    runs-on: custom-linux-large
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build gotestsum (version pinned in .tools/go.mod)
        run: make .tools/bin/gotestsum
      - name: Run tests
        run: |
          .tools/bin/gotestsum \
           --format pkgname-and-test-fails \
           --format-hide-empty-pkg -- \
           -timeout=30s \
           -parallel=32 \
           -run='^Test[^A]|^TestA[^c]|^TestAc[^c]' \
           ./...

  copyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      # make builds the license-eye version pinned in .tools/go.mod
      - run: make copyright

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        run: make shellcheck

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make downloads the typos release pinned in GNUmakefile into .tools/bin
      - name: Run typos
        run: make typos

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make downloads the zizmor version pinned in GNUmakefile into .tools/bin
      - name: Run zizmor
        run: make zizmor

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      # make builds the actionlint version pinned in .tools/go.mod and downloads shellcheck
      - name: Run actionlint
        run: make actionlint

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # make installs the yamllint version pinned in GNUmakefile into a repo-local venv
      - name: Run yamllint
        run: make yamllint

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - run: make validate-examples

  teamcity-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
          java-package: jdk
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
          lookup-only: true
      - run: make teamcity-test
