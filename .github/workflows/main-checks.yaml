---
name: Main Branch Checks

# Runs the tree-state CI checks on every push to main (and release branches).
# PR checks only run on pull_request events, so without this workflow a merge to
# main is never validated: two PRs that are each green in isolation can still
# break main when combined (semantic merge conflicts, a renamed helper another
# PR started using, etc.).
#
# Every job runs on every push - deliberately no path filtering. A per-push
# paths filter makes the branch tip's green check meaningless: a docs-only or
# workflow-only push would skip the Go checks and show green even when the
# previous (code) push failed or had its run cancelled. Since every run covers
# the complete tree state, cancelling a superseded run loses nothing.
#
# This intentionally duplicates the check jobs in pr-checks-combined.yaml (and
# teamcity-test.yaml) rather than adding a push trigger to them: those workflows
# feed the PR comment/labeling machinery (pr-save-artifacts.yaml -> workflow_run
# watchers matched by display name), which has no PR to act on for a push
# event. Keep the check steps here in sync with their PR counterparts when
# updating either side.
#
# The OIDC provider acceptance tests are excluded — nightly TeamCity runs cover
# main.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**

concurrency:
  # Only the newest push per branch matters - the tip includes earlier merges,
  # and since every run executes all checks the newest run supersedes any it cancels.
  group: 'main-checks-${{ github.ref }}'
  cancel-in-progress: true

jobs:

  # Unlike the PR workflow there is no fail-fast phasing here: on main we want
  # the complete picture of everything broken in one run, not saved runner time.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - name: Build Provider
        run: go build -v -o /dev/null main.go

  depscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - run: make tools
      - run: make depscheck

  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - name: Install tooling
        run: |
          # golangci-lint version is sourced from scripts/.custom-gcl.yml - the single source of truth
          GOLANGCI_LINT_VERSION="$(sed -n 's/^version: *//p' scripts/.custom-gcl.yml)"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          go install github.com/katbyte/terrafmt@latest
      - run: make quick-checks

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - run: make tools
      - run: make docs-lint

  golint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      # The tfproviderlint module plugin requires a custom-built golangci-lint binary (see
      # scripts/.custom-gcl.yml); cache it so it is only rebuilt when the plugin config (which
      # pins the golangci-lint version) changes. The make target rebuilds the binary when it
      # is missing or its version is stale.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: scripts/golangci-with-modules
          key: golangci-with-modules-${{ hashFiles('scripts/.custom-gcl.yml') }}
      - name: Build golangci-lint with plugins
        run: make golangci-with-modules
      - name: Run golangci-lint
        run: ./scripts/golangci-with-modules run -v ./...

  gencheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - run: make tools
      - run: make gencheck

  unit-tests:
    runs-on: custom-linux-large
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - run: make test
        env:
          GITHUB_ACTIONS_STAGE: "UNIT_TESTS"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run ShellCheck
        run: make shellcheck

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install typos
        run: |
          v="$(sed -n 's/^TYPOS_VERSION := //p' GNUmakefile)"
          curl -sSfL "https://github.com/crate-ci/typos/releases/download/${v}/typos-${v}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C /usr/local/bin ./typos
      - name: Run typos
        run: make typos

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
      - run: make tools
      - run: make validate-examples

  teamcity-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 21
          java-package: jdk
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - run: make teamcity-test
