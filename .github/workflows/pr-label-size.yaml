---
name: PR Label Size

# Labels PRs by diff size (size/XS through size/XL) and by touched paths
# (.github/labeler-pull-request-triage.yaml).

permissions:
  pull-requests: write
  issues: write

on: [pull_request_target]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          configuration-path: .github/labeler-pull-request-triage.yaml
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: CodelyTV/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: '30'
          s_label: 'size/S'
          s_max_size: '60'
          m_label: 'size/M'
          m_max_size: '150'
          l_label: 'size/L'
          l_max_size: '300'
          xl_label: 'size/XL'
          message_if_xl: ''
          files_to_ignore: |
            "vendor/*"
            "go.mod"
