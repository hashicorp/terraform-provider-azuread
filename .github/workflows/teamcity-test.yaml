---
name: TeamCity Config Test

# Validates the .teamcity/ Kotlin DSL configuration (Maven test run) whenever it
# changes.
# Display name is matched by the workflow_run list in pr-waiting-response-on-ci-fail.yaml.

permissions:
  contents: read

on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/workflows/teamcity-test.yaml'
      - '!.teamcity/components/generated/**'
      - '!.teamcity/target/**'
      - '.teamcity/**'

concurrency:
  group: 'tctest-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  teamcity-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 21
          java-package: jdk
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - run: make teamcity-test
      - name: Guidance on failure
        if: failure()
        run: |
          echo "::error::TeamCity Config Test failed."
          echo ""
          echo "Run 'make teamcity-test' locally (requires Java 21 and Maven) to validate"
          echo "the TeamCity Kotlin DSL under .teamcity/."

  save-artifacts-on-fail:
    needs: teamcity-test
    if: ${{ failure() }}
    uses: $/.github/workflows/pr-save-artifacts.yaml

  comment-on-fail:
    needs: teamcity-test
    if: ${{ failure() }}
    uses: $/.github/workflows/pr-comment-failure.yaml
    permissions:
      issues: write
      pull-requests: write
    with:
      check_name: "TeamCity Config Test"

  comment-outdated-on-pass:
    needs: teamcity-test
    if: ${{ success() }}
    uses: $/.github/workflows/pr-comment-failure-outdated.yaml
    permissions:
      issues: write
      pull-requests: write
    with:
      check_name: "TeamCity Config Test"
